name: Update tool count

on:
  schedule:
    - cron: "17 1 * * *" # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tool-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update profile README from live statistics
        run: python scripts/update_tool_count.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "tool count unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update tool count" -s
          git push
